[pytest]
# strict-markers: an unregistered marker (a typo, or "slow" before it was
# registered here) is an error, not a silent no-op - a guard that can
# silently stop meaning anything is worse than no guard.
addopts = --strict-markers
markers =
    slow: real preprocessing against full-size checkouts of Coldcard or Trust
        Wallet Core, fetched into the runner's cache (tests/conftest.py), tens
        of seconds to a few minutes each. Added automatically to any test
        using those fixtures; they only run with --real-checkouts, and
        `-m "not slow"` leaves them out for fast local iteration.
