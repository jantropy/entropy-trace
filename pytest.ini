[pytest]
# strict-markers: an unregistered marker (a typo, or "slow" before it was
# registered here) is an error, not a silent no-op - a guard that can
# silently stop meaning anything is worse than no guard.
addopts = --strict-markers
markers =
    slow: real preprocessing against full-size scratch checkouts (Coldcard
        differential worktrees, Trust Wallet Core), tens of seconds to a
        few minutes each -- excluded by `-m "not slow"` for fast local
        iteration.
