# Coldcard's patched commit, as a profile. Same shape as
# coldcard-vulnerable.yaml - only repo_root/label/commit differ, which is
# exactly the point of a profile: the vulnerable/patched difference lives
# entirely in which real checkout is pointed at, not in any code path.
repo_root: /Users/satadel/scratch-entropy/coldcard-patched
label: "patched (fixes rng)"
commit: "ca72463709f4e3f8964952039d5caf955f566a87"
repo: "Coldcard/firmware"

adapter: coldcard
board: COLDCARD_MK4
build:
  backend: make

target_yaml: data/targets/arm-none-eabi-cortex-m4-gcc11.yaml

run_bip32_anchor: true

config_values:
  - name: MICROPY_HW_ENABLE_RNG
    file: stm32/COLDCARD_MK4/mpconfigboard.h
